name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Build (unsigned)
      run: |
        xcodebuild archive \
          -project CheatiOSVip.xcodeproj \
          -scheme CheatiOSVip \
          -archivePath "$RUNNER_TEMP/CheatiOSVip.xcarchive" \
          -configuration Release \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          | xcpretty

    - name: Package .app
      run: |
        mkdir -p "$RUNNER_TEMP/Payload"
        cp -r "$RUNNER_TEMP/CheatiOSVip.xcarchive/Products/Applications/CheatiOSVip.app" \
              "$RUNNER_TEMP/Payload/"
        cd "$RUNNER_TEMP"
        zip -r CheatiOSVip-unsigned.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: CheatiOSVip-unsigned
        path: ${{ runner.temp }}/CheatiOSVip-unsigned.ipa
        retention-days: 30
