name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Import certificate
      env:
        CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
        CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
        echo "$CERTIFICATE_BASE64" | base64 --decode > /tmp/cert.p12

        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security import /tmp/cert.p12 -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
        security list-keychain -d user -s "$KEYCHAIN_PATH"
        security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

    - name: Import provisioning profile
      env:
        PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
      run: |
        echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > /tmp/profile.mobileprovision
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

    - name: Build archive
      env:
        TEAM_ID: ${{ secrets.TEAM_ID }}
      run: |
        xcodebuild archive \
          -project CheatiOSVip.xcodeproj \
          -scheme CheatiOSVip \
          -archivePath "$RUNNER_TEMP/CheatiOSVip.xcarchive" \
          -configuration Release \
          CODE_SIGN_STYLE=Manual \
          TEAM_ID="$TEAM_ID" \
          PROVISIONING_PROFILE_SPECIFIER="${{ secrets.PROVISIONING_PROFILE_NAME }}" \
          | xcpretty

    - name: Export IPA
      run: |
        xcodebuild -exportArchive \
          -archivePath "$RUNNER_TEMP/CheatiOSVip.xcarchive" \
          -exportPath "$RUNNER_TEMP/output" \
          -exportOptionsPlist ExportOptions.plist \
          | xcpretty

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: CheatiOSVip-IPA
        path: ${{ runner.temp }}/output/*.ipa
        retention-days: 30
